<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Animación 3D — Blender</title>
    <link rel="manifest" href="manifest.json?v=2">
    <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
    </script>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d2e;
            --surface2: #242740;
            --accent: #7c6af7;
            --accent2: #5ee7c8;
            --text: #e8eaf6;
            --muted: #8892b0;
            --border: #2d3154;
            --danger: #f06292;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 48px 40px 40px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .login-logo .icon {
            font-size: 2.8rem;
            display: block;
            margin-bottom: 10px;
        }
        .login-logo h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
        }
        .login-logo p {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 4px;
        }
        h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 20px;
            text-align: center;
        }
        .field {
            margin-bottom: 14px;
        }
        input[type="email"],
        input[type="password"] {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text);
            font-size: 0.92rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="email"]::placeholder,
        input[type="password"]::placeholder {
            color: var(--muted);
        }
        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: var(--accent);
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--accent), #5a4fd6);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:active { transform: scale(0.98); }
        .error-msg {
            color: var(--danger);
            font-size: 0.82rem;
            text-align: center;
            margin-top: 12px;
            min-height: 18px;
        }
        .toggle-row {
            text-align: center;
            margin-top: 22px;
            font-size: 0.83rem;
            color: var(--muted);
        }
        .toggle-row button {
            background: none;
            border: none;
            color: var(--accent2);
            cursor: pointer;
            font-size: 0.83rem;
            font-weight: 600;
            padding: 0;
            margin-left: 4px;
        }
        .toggle-row button:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <span class="icon">🎬</span>
            <h1>Plan Animación 3D</h1>
            <p>con Blender — 20 sesiones</p>
        </div>
        <h2 id="authTitle">Iniciar sesión</h2>
        <div class="field">
            <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
        </div>
        <div class="field">
            <input type="password" id="authPassword" placeholder="Contraseña" autocomplete="current-password">
        </div>
        <button class="btn-primary" id="authSubmitBtn">Entrar</button>
        <p class="error-msg" id="authError"></p>
        <div class="toggle-row">
            <span id="authToggleText">¿No tienes cuenta?</span>
            <button type="button" id="authToggleBtn">Registrarse</button>
        </div>
    </div>

    <script>
        let authMode = 'login';

        // If already logged in, go straight to the plan
        (async () => {
            try {
                const res = await fetch('/api/auth/me');
                if (res.ok) {
                    const data = await res.json();
                    if (data.email) { window.location.replace('plan.html'); return; }
                }
            } catch (_) {}
        })();

        const authTitle    = document.getElementById('authTitle');
        const authEmail    = document.getElementById('authEmail');
        const authPassword = document.getElementById('authPassword');
        const authSubmit   = document.getElementById('authSubmitBtn');
        const authError    = document.getElementById('authError');
        const toggleText   = document.getElementById('authToggleText');
        const toggleBtn    = document.getElementById('authToggleBtn');

        function setMode(mode) {
            authMode = mode;
            if (mode === 'login') {
                authTitle.textContent = 'Iniciar sesión';
                authSubmit.textContent = 'Entrar';
                toggleText.textContent = '¿No tienes cuenta?';
                toggleBtn.textContent = 'Registrarse';
            } else {
                authTitle.textContent = 'Crear cuenta';
                authSubmit.textContent = 'Registrarse';
                toggleText.textContent = '¿Ya tienes cuenta?';
                toggleBtn.textContent = 'Iniciar sesión';
            }
            authError.textContent = '';
        }

        toggleBtn.addEventListener('click', () => setMode(authMode === 'login' ? 'signup' : 'login'));

        authPassword.addEventListener('keydown', e => { if (e.key === 'Enter') authSubmit.click(); });

        authSubmit.addEventListener('click', async () => {
            const email    = authEmail.value.trim();
            const password = authPassword.value;
            authError.textContent = '';

            if (!email || !password) {
                authError.textContent = 'Completa todos los campos.';
                return;
            }

            authSubmit.disabled = true;
            authSubmit.textContent = '...';

            try {
                const endpoint = authMode === 'signup' ? '/api/auth/signup' : '/api/auth/login';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) {
                    authError.textContent = data.error || 'Error al autenticarse.';
                    authSubmit.disabled = false;
                    authSubmit.textContent = authMode === 'login' ? 'Entrar' : 'Registrarse';
                    return;
                }
                window.location.replace('plan.html');
            } catch (err) {
                authError.textContent = 'Error de conexión.';
                authSubmit.disabled = false;
                authSubmit.textContent = authMode === 'login' ? 'Entrar' : 'Registrarse';
            }
        });
    </script>
</body>
</html>
