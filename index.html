<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json?v=2">
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
    </script>
</head>
<body>

    <div class="user-bar hidden" id="userBar">
        <span id="userEmail"></span>
        <button id="logoutBtn">Log out</button>
    </div>

    <div class="auth-card" id="authCard">
        <h2 id="authTitle">Log in</h2>
        <div class="input-group">
            <input type="email" id="authEmail" placeholder="Email" autocomplete="email">
            <input type="password" id="authPassword" placeholder="Password" autocomplete="current-password">
            <button id="authSubmitBtn">Log in</button>
        </div>
        <p id="authError" class="auth-error hidden"></p>
        <p class="auth-toggle">
            <span id="authToggleText">Need an account?</span>
            <button type="button" id="authToggleBtn">Sign up</button>
        </p>
    </div>

    <div class="app-container hidden" id="appContainer">
        <a href="plan.html" class="plan-link-btn">🎬 Plan Animación 3D con Blender →</a>
        <div class="pomodoro-card">
            <div class="tabs-group">
                <button class="tab-btn active" id="workTab">Focus</button>
                <button class="tab-btn" id="shortTab">Short Break</button>
                <button class="tab-btn" id="longTab">Long Break</button>
            </div>

            <h1 id="statusText">Focus</h1>
            <p class="pomodoro-count" id="pomodoroCount">Pomodoro 1 of 4</p>
            <div class="timer-display" id="timer">25:00</div>

            <div class="btn-group">
                <button class="btn-start" id="startBtn">Start</button>
                <button class="btn-reset" id="resetBtn">Reset</button>
            </div>
        </div>
        <div class="tasks-card">
            <h2>To-Do List</h2>
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="Write your task..." autocomplete="off">
                <select id="taskPriority">
                    <option value="normal" selected>Normal</option>
                    <option value="important">Important</option>
                    <option value="urgent">Urgent</option>
                </select>
                <button id="addTaskBtn">Add Task</button>
            </div>
            <ul class="task-list" id="taskList">

            </ul>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
