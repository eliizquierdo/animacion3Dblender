<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plan Animación 3D — Blender</title>
<link rel="manifest" href="manifest.json?v=2">
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d2e;
    --surface2: #242740;
    --accent: #7c6af7;
    --accent2: #5ee7c8;
    --accent3: #f7c26a;
    --text: #e8eaf6;
    --muted: #8892b0;
    --border: #2d3154;
    --success: #4caf87;
    --danger: #f06292;
    --week1: #7c6af7;
    --week2: #5ee7c8;
    --week3: #f7c26a;
    --week4: #f06292;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }

  /* ── ACCORDION RESOURCES ────────────────────────────────────────── */
  .resources-accordion {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; margin-bottom: 24px; overflow: hidden;
  }
  .resources-toggle {
    width: 100%; background: transparent; border: none;
    padding: 16px 20px; display: flex; align-items: center;
    justify-content: space-between; cursor: pointer;
    color: var(--text); font-size: 0.9rem; font-weight: 700;
    gap: 10px;
  }
  .resources-toggle:hover { background: rgba(255,255,255,0.03); }
  .resources-toggle .chevron {
    font-size: 0.75rem; color: var(--muted);
    transition: transform 0.25s; flex-shrink: 0;
  }
  .resources-accordion.open .chevron { transform: rotate(180deg); }
  .resources-body {
    display: none; padding: 0 20px 16px;
    border-top: 1px solid var(--border);
  }
  .resources-accordion.open .resources-body { display: block; }

  /* ── APP SHELL ──────────────────────────────────────────────────── */
  .app { display: none; flex-direction: column; min-height: 100vh; }
  .app.visible { display: flex; }

  /* HEADER */
  .header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center;
    justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-link { text-decoration: none; color: var(--muted); font-size: 0.8rem; display: flex; align-items: center; gap: 6px; border: 1px solid var(--border); padding: 5px 10px; border-radius: 8px; transition: all 0.2s; }
  .logo-link:hover { border-color: var(--accent); color: var(--accent); }
  .logo h1 { font-size: 1rem; font-weight: 700; color: var(--text); }
  .logo p { font-size: 0.72rem; color: var(--muted); }
  .progress-bar-wrap { flex: 1; min-width: 180px; max-width: 320px; }
  .progress-label { font-size: 0.72rem; color: var(--muted); margin-bottom: 4px; display: flex; justify-content: space-between; }
  .progress-bar { background: var(--border); border-radius: 99px; height: 7px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.4s ease; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .user-email { font-size: 0.78rem; color: var(--muted); }
  .btn-sm { padding: 7px 13px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); color: var(--muted); cursor: pointer; font-size: 0.78rem; transition: all 0.2s; }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }

  /* LAYOUT */
  .layout { display: grid; grid-template-columns: 260px 1fr; flex: 1; min-height: 0; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

  /* SIDEBAR */
  .sidebar {
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 16px; overflow-y: auto;
  }
  .week-group { margin-bottom: 20px; }
  .week-label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 6px 10px; border-radius: 6px; margin-bottom: 8px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .w1 .week-label { background: rgba(124,106,247,0.15); color: var(--week1); }
  .w2 .week-label { background: rgba(94,231,200,0.15); color: var(--week2); }
  .w3 .week-label { background: rgba(247,194,106,0.15); color: var(--week3); }
  .w4 .week-label { background: rgba(240,98,146,0.15); color: var(--week4); }
  .week-badge { font-size: 0.63rem; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 99px; }
  .session-btn {
    width: 100%; text-align: left; background: transparent; border: 1px solid transparent;
    color: var(--muted); padding: 7px 10px; border-radius: 7px; cursor: pointer;
    font-size: 0.82rem; margin-bottom: 3px; transition: all 0.15s;
    display: flex; align-items: center; gap: 8px;
  }
  .session-btn:hover { background: var(--surface2); color: var(--text); }
  .session-btn.active { background: var(--surface2); border-color: var(--accent); color: var(--text); }
  .session-btn.done { color: var(--success); }
  .s-num {
    font-size: 0.68rem; background: var(--surface2); width: 22px; height: 22px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-weight: 700;
  }
  .session-btn.done .s-num { background: rgba(76,175,135,0.2); color: var(--success); }
  .session-btn.active .s-num { background: var(--accent); color: #fff; }
  .s-name { line-height: 1.3; flex: 1; }
  .friday-tag { font-size: 0.58rem; background: rgba(247,194,106,0.2); color: var(--accent3); padding: 1px 5px; border-radius: 3px; flex-shrink: 0; }

  /* MAIN */
  .main { padding: 24px; overflow-y: auto; }
  .main-inner { max-width: 860px; }

  /* RESOURCES */
  .resources-panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px; margin-bottom: 24px;
  }
  .resources-panel h2 { font-size: 0.9rem; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .resource-list { display: flex; flex-direction: column; gap: 8px; }
  .resource-item { background: var(--surface2); border-radius: 8px; padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px; }
  .resource-icon { font-size: 1.1rem; flex-shrink: 0; margin-top: 2px; }
  .resource-info a { color: var(--accent2); font-size: 0.85rem; font-weight: 600; text-decoration: none; }
  .resource-info a:hover { text-decoration: underline; }
  .resource-info p { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .resource-badge { font-size: 0.63rem; padding: 2px 6px; border-radius: 99px; background: rgba(94,231,200,0.15); color: var(--accent2); font-weight: 700; margin-left: 5px; }

  /* TODAY CARD */
  .today-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 24px; margin-bottom: 24px;
  }
  .today-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .tag { font-size: 0.7rem; padding: 3px 10px; border-radius: 99px; font-weight: 600; }
  .tag-week { background: rgba(124,106,247,0.15); color: var(--accent); }
  .tag-day { background: rgba(94,231,200,0.15); color: var(--accent2); }
  .tag-duration { background: rgba(247,194,106,0.15); color: var(--accent3); }
  .tag-friday { background: rgba(240,98,146,0.15); color: var(--danger); }
  .tag-done { background: rgba(76,175,135,0.15); color: var(--success); }
  .today-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 6px; }
  .today-objective { color: var(--muted); font-size: 0.88rem; }

  /* POMODORO — 3 phases + cycle counter (matches original Pomodoro app style) */
  .pomodoro-wrap { margin: 20px 0; }
  .pomo-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .pomo-tab {
    padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: transparent; color: var(--muted); cursor: pointer;
    font-size: 0.8rem; font-weight: 600; transition: all 0.2s;
  }
  .pomo-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pomo-tab.active.short { background: var(--accent2); border-color: var(--accent2); color: #1a1d2e; }
  .pomo-tab.active.long { background: var(--success); border-color: var(--success); color: #fff; }
  .pomodoro {
    background: var(--surface2); border-radius: 14px; padding: 18px 22px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  }
  .pomo-left { display: flex; flex-direction: column; gap: 4px; }
  .pomo-phase-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
  .pomo-time { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1; }
  .pomo-time.running { color: var(--accent2); }
  .pomo-time.paused { color: var(--accent3); }
  .pomo-cycle { font-size: 0.78rem; color: var(--accent3); font-weight: 600; }
  .pomo-btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { padding: 9px 18px; border-radius: 9px; border: none; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all 0.2s; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #6a58e5; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
  .btn-secondary:hover { border-color: var(--accent); }
  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { filter: brightness(1.1); }
  .btn-muted { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); cursor: default; }

  /* DETAILS */
  .details-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 20px 0; }
  @media (max-width: 600px) { .details-grid { grid-template-columns: 1fr; } }
  .detail-box { background: var(--surface2); border-radius: 12px; padding: 16px; }
  .detail-box h3 { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .detail-box p, .detail-box li { font-size: 0.87rem; color: var(--text); line-height: 1.65; }
  .detail-box ul { padding-left: 16px; }
  .detail-box li { margin-bottom: 4px; }
  .detail-resource { color: var(--accent2) !important; text-decoration: none; }
  .detail-resource:hover { text-decoration: underline; }
  .check-pill { display: inline-block; background: rgba(76,175,135,0.12); color: var(--success); border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; margin-top: 4px; }
  .alt-pill { display: inline-block; background: rgba(247,194,106,0.1); color: var(--accent3); border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; margin-top: 4px; }

  /* LOG */
  .log-section { margin-top: 24px; border-top: 1px solid var(--border); padding-top: 20px; }
  .log-section h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; }
  .log-field { margin-bottom: 14px; }
  .log-field label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); display: block; margin-bottom: 6px; }
  .log-field textarea {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 9px; color: var(--text); padding: 10px 13px;
    font-size: 0.87rem; resize: vertical; min-height: 68px;
    font-family: inherit; transition: border-color 0.2s;
  }
  .log-field textarea:focus { outline: none; border-color: var(--accent); }
  .log-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .saving-indicator { font-size: 0.75rem; color: var(--muted); }
  .saving-indicator.ok { color: var(--success); }

  /* HISTORY */
  .history-section { margin-top: 28px; border-top: 1px solid var(--border); padding-top: 20px; }
  .history-section h2 { font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; }
  .history-empty { color: var(--muted); font-size: 0.87rem; text-align: center; padding: 20px; background: var(--surface2); border-radius: 10px; }
  .history-item { background: var(--surface2); border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; border-left: 3px solid var(--accent); }
  .history-item.done { border-left-color: var(--success); }
  .history-meta { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; flex-wrap: wrap; }
  .history-date { font-size: 0.7rem; color: var(--muted); }
  .history-snum { font-size: 0.7rem; font-weight: 700; color: var(--accent2); }
  .history-status { font-size: 0.63rem; padding: 2px 7px; border-radius: 99px; }
  .history-status.done { background: rgba(76,175,135,0.2); color: var(--success); }
  .history-status.partial { background: rgba(247,194,106,0.2); color: var(--accent3); }
  .history-title { font-size: 0.87rem; font-weight: 600; margin-bottom: 4px; }
  .history-body { font-size: 0.81rem; color: var(--muted); }
  .history-body strong { color: var(--text); }

  /* EXPORT */
  .btn-export {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--muted); padding: 7px 13px; border-radius: 8px;
    cursor: pointer; font-size: 0.78rem; transition: all 0.2s;
  }
  .btn-export:hover { border-color: var(--accent); color: var(--accent); }

  /* TOAST */
  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--success); color: #fff;
    padding: 11px 18px; border-radius: 10px;
    font-size: 0.86rem; font-weight: 600;
    opacity: 0; transform: translateY(10px);
    transition: all 0.3s; pointer-events: none; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.error { background: var(--danger); }

  /* LOADING */
  .loading-screen {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; z-index: 50;
  }
  .loading-screen.hidden { display: none; }
  .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-screen p { color: var(--muted); font-size: 0.88rem; }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <p>Cargando tu plan...</p>
</div>

<!-- sin overlay: si no está logueado se redirige a index.html -->

<!-- APP -->
<div class="app" id="app">
  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <a href="index.html" class="logo-link">← Pomodoro</a>
      <div class="logo">
        <div><b>🎬 Animación 3D con Blender</b></div>
        <div style="font-size:0.72rem;color:var(--muted)">Plan 4 semanas · 🇺🇾 Uruguay · Gratis</div>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-label">
        <span>Progreso</span>
        <span id="progressText">0 / 20</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="header-right">
      <button class="btn-export" onclick="exportMarkdown()">⬇ Exportar</button>
      <span class="user-email" id="userEmail"></span>
      <button class="btn-sm" id="logoutBtn">Log out</button>
    </div>
  </div>

  <div class="layout">
    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar"></div>

    <!-- MAIN -->
    <div class="main">
      <div class="main-inner" id="main-inner">
        <div id="session-view"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════
// PLAN DATA
// ══════════════════════════════════════════════════════════════
const sessions = [
  { id:1, week:1, day:1, isFriday:false,
    title:"Interfaz + Modelado poligonal inorgánico",
    objetivo:"Instalar Blender, dominar la interfaz y crear tu primer modelo inorgánico cuidando la topología básica.",
    tarea:"Descargar Blender, explorar los paneles y modelar un objeto inorgánico simple (mesa, silla, cubo con detalles) cuidando que las caras sean cuadriláteros.",
    pasos:["Descargar Blender 5.0 desde blender.org (gratis). Instalar.","Aprender atajos clave: G=mover, R=rotar, S=escalar + X/Y/Z para restringir eje. Tab=Edit Mode.","En Edit Mode: 1=vértices, 2=aristas, 3=caras. Herramientas: E(extrude), I(inset), Ctrl+R(loop cut).","Modelar una mesa: cubo → escalar en X/Y para el tablero → extruir 4 patas hacia abajo.","Verificar topología: las caras deben ser principalmente cuadriláteros (quads), no triángulos ni n-gons."],
    recurso:{nombre:"Blender Studio — Blender Fundamentals 4.5 LTS (gratis, oficial)",url:"https://studio.blender.org/training/blender-fundamentals-45-lts/"},
    resultado:"Un modelo inorgánico sencillo con topología limpia (quads), guardado como .blend.",
    comprobacion:"Activá Overlays > Face Orientation: las caras deben verse azules (normales hacia afuera), no rojas.",
    alternativa:"Si los atajos se complican, usá la barra de herramientas (T) para hacer las mismas operaciones con el mouse.",
    duracion:"60-90 min" },
  { id:2, week:1, day:2, isFriday:false,
    title:"Modelado orgánico y topología para animación",
    objetivo:"Entender edge flow y topología orgánica: cómo modelar formas suaves que se deformen bien al animar.",
    tarea:"Modelar una cara/cabeza simple o una mano usando Subdivision Surface y controlando el flujo de aristas.",
    pasos:["Agregar modificador Subdivision Surface (nivel 2) para ver el impacto del edge flow.","Aprender Edge Crease (Shift+E) para endurecer aristas específicas sin romper el suavizado.","Concepto clave: los edge loops deben seguir los contornos del músculo/forma que se va a deformar.","Modelar una forma esférica y 'tirarle' aristas para crear una nariz, boca o mano simple.","Usar el modificador Mirror para trabajar solo la mitad y que se refleje automáticamente."],
    recurso:{nombre:"YouTube — 'Blender organic modeling topology for beginners'",url:"https://www.youtube.com/results?search_query=blender+organic+modeling+topology+beginners"},
    resultado:"Una forma orgánica suavizada (cabeza o mano simple) con topología limpia.",
    comprobacion:"Al activar Subdivision Surface nivel 3, la forma se suaviza sin que aparezcan pinches ni distorsiones.",
    alternativa:"Modelá primero un limón o una manzana: formas simples que enseñan los mismos principios orgánicos.",
    duracion:"60-90 min" },
  { id:3, week:1, day:3, isFriday:false,
    title:"Curvas, múltiples objetos, colecciones e instancias",
    objetivo:"Aprender a modelar con curvas Bezier/NURBS y a organizar escenas con múltiples objetos usando colecciones e instancias.",
    tarea:"Crear un camino/tubo con curvas, luego organizar una escena con varios objetos usando colecciones e instancias de objetos.",
    pasos:["Shift+A > Curve > Bezier: crear una curva, editar sus puntos con G y las manijas con Alt+S para el grosor.","Convertir la curva a mesh (Object > Convert > Mesh) para seguir editando como polígono.","Crear colecciones: click derecho en Outliner > New Collection. Arrastrá objetos adentro.","Instancias: seleccioná un objeto, en Properties > Object Properties > Instancing > Faces o Verts para distribuir copias.","Diferencia entre instancia (linked, más liviana) y copia real (Alt+D vs Shift+D)."],
    recurso:{nombre:"Blender Studio — Fundamentals: Curves & Collections",url:"https://studio.blender.org/training/blender-fundamentals-45-lts/"},
    resultado:"Una escena organizada en colecciones con al menos un objeto usando instancias.",
    comprobacion:"Al mover el objeto 'fuente' de una instancia, todas las copias se mueven junto con él.",
    alternativa:"Saltá las instancias y enfocate solo en curvas + colecciones si el tiempo no alcanza.",
    duracion:"60 min" },
  { id:4, week:1, day:4, isFriday:false,
    title:"Geometry Nodes: Scattering de objetos",
    objetivo:"Introducción a los Geometry Nodes: aprender a distribuir/scatter objetos sobre una superficie.",
    tarea:"Usar Geometry Nodes para distribuir árboles, piedras o flores sobre un plano de terreno.",
    pasos:["Seleccioná un plano, ve a Properties > Modifier > Add Modifier > Geometry Nodes > New.","En el editor de Geometry Nodes: Add > Instances > Instance on Points.","Add > Geometry > Distribute Points on Faces para generar puntos de distribución.","Conectar: Geometry Input → Distribute Points → Instance on Points → Geometry Output.","En 'Instance' del nodo: elegí el objeto que querés dispersar. Ajustá Density para más/menos instancias."],
    recurso:{nombre:"YouTube — 'Blender Geometry Nodes scatter objects beginners 2025'",url:"https://www.youtube.com/results?search_query=blender+geometry+nodes+scatter+objects+beginners+2025"},
    resultado:"Un plano con objetos dispersos aleatoriamente usando Geometry Nodes.",
    comprobacion:"Al cambiar el valor de Seed en Distribute Points, los objetos cambian de posición aleatoriamente.",
    alternativa:"Usá el add-on gratuito 'Scatter' o hacelo manualmente con instancias si los nodos resultan difíciles.",
    duracion:"60-90 min" },
  { id:5, week:1, day:5, isFriday:true,
    title:"INTEGRACIÓN S1: Sculpting — blocking, refinado y retopología",
    objetivo:"Esculpir una forma base orgánica y hacer retopología básica para que sea apta para animación.",
    tarea:"Esculpir una cabeza o criatura simple en Sculpt Mode y luego retopologizarla con la herramienta Poly Build.",

const weekNames  = { 1:"Semana 1 — Modelado y Sculpting", 2:"Semana 2 — Shading, UV y Cabello", 3:"Semana 3 — Rigging y Animación", 4:"Semana 4 — Producción y Render" };

// ══════════════════════════════════════════════════════════════
// STATE (cloud-backed; no localStorage)
// ══════════════════════════════════════════════════════════════
let state = {
  currentSession: 1,
  progress: {}  // keyed by session_id → { completed, notes_done, notes_block, notes_next, pomodoros, updated_at }
};

async function loadProgress() {
  const res = await fetch('/api/plan');
  if (!res.ok) return;
  const data = await res.json();
  (data.sessions || []).forEach(row => {
    state.progress[row.session_id] = row;
  });
}

let saveTimer = null;
function scheduleSave(sessionId) {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveSession(sessionId), 1200);
}

async function saveSession(sessionId) {
  const log = state.progress[sessionId] || {};
  setSavingIndicator('saving');
  try {
    const res = await fetch(`/api/plan/${sessionId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        completed:   log.completed   ?? false,
        notes_done:  log.notes_done  ?? '',
        notes_block: log.notes_block ?? '',
        notes_next:  log.notes_next  ?? '',
        pomodoros:   log.pomodoros   ?? 0
      })
    });
    if (res.ok) {
      const data = await res.json();
      state.progress[sessionId] = data.session;
      setSavingIndicator('ok');
    } else {
      setSavingIndicator('error');
    }
  } catch (e) {
    setSavingIndicator('error');
  }
}

function setSavingIndicator(status) {
  const el = document.getElementById('saving-indicator');
  if (!el) return;
  if (status === 'saving') { el.textContent = '⏳ Guardando...'; el.className = 'saving-indicator'; }
  else if (status === 'ok') { el.textContent = '✓ Guardado'; el.className = 'saving-indicator ok'; }
  else { el.textContent = '⚠ Error al guardar'; el.className = 'saving-indicator'; }
}

// ══════════════════════════════════════════════════════════════
// POMODORO — 3 phases + cycle counter
// ══════════════════════════════════════════════════════════════
const PHASES = [
  { key: 'focus',  label: 'Focus',       minutes: 25, tabClass: '' },
  { key: 'short',  label: 'Short Break', minutes: 5,  tabClass: 'short' },
  { key: 'long',   label: 'Long Break',  minutes: 15, tabClass: 'long' }
];
let pomoPhase     = 0;   // 0=focus, 1=short, 2=long
let pomoRemaining = PHASES[0].minutes * 60;
let pomoRunning   = false;
let pomoInterval  = null;
let pomoCycle     = 1;   // which focus block in a set of 4
let pomoFocusDone = 0;   // total focus sessions completed

function getPomoKey() { return `pomo_${state.currentSession}`; }

function switchPhase(idx) {
  clearInterval(pomoInterval);
  pomoRunning = false;
  pomoPhase = idx;
  pomoRemaining = PHASES[idx].minutes * 60;
  updatePomoUI();
}

function updatePomoUI() {
  const m = Math.floor(pomoRemaining / 60).toString().padStart(2,'0');
  const s = (pomoRemaining % 60).toString().padStart(2,'0');
  const timeEl = document.getElementById('pomo-time');
  if (!timeEl) return;
  timeEl.textContent = `${m}:${s}`;
  timeEl.className = 'pomo-time' + (pomoRunning ? ' running' : pomoRemaining < PHASES[pomoPhase].minutes*60 ? ' paused' : '');
  const cycleEl = document.getElementById('pomo-cycle');
  if (cycleEl) cycleEl.textContent = `Pomodoro ${pomoCycle} de 4`;
  // Update tab buttons
  PHASES.forEach((p, i) => {
    const tab = document.getElementById(`pomo-tab-${i}`);
    if (tab) tab.className = 'pomo-tab' + (i === pomoPhase ? ` active ${p.tabClass}` : ` ${p.tabClass}`);
  });
}

function startPomo() {
  if (pomoRunning) return;
  pomoRunning = true;
  updatePomoUI();
  pomoInterval = setInterval(() => {
    pomoRemaining--;
    updatePomoUI();
    if (pomoRemaining <= 0) {
      clearInterval(pomoInterval);
      pomoRunning = false;
      if (pomoPhase === 0) {
        // Completed a focus session
        pomoFocusDone++;
        const row = state.progress[state.currentSession] || {};
        row.pomodoros = (row.pomodoros || 0) + 1;
        state.progress[state.currentSession] = row;
        saveSession(state.currentSession);
        showToast('¡Pomodoro completado! 🍅 Tomá un descanso.');
        // Auto-advance: every 4 focus → long break, otherwise short break
        if (pomoCycle >= 4) {
          pomoCycle = 1;
          switchPhase(2); // long break
        } else {
          pomoCycle++;
          switchPhase(1); // short break
        }
      } else {
        showToast('Descanso terminado. ¡A trabajar! 🎬');
        switchPhase(0); // back to focus
      }
    }
  }, 1000);
}

function pausePomo() {
  if (!pomoRunning) return;
  clearInterval(pomoInterval);
  pomoRunning = false;
  updatePomoUI();
}

function resetPomo() {
  clearInterval(pomoInterval);
  pomoRunning = false;
  pomoRemaining = PHASES[pomoPhase].minutes * 60;
  updatePomoUI();
}

// ══════════════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════════════
function countDone() {
  return sessions.filter(s => state.progress[s.id]?.completed).length;
}

function updateProgress() {
  const done = countDone();
  const pct  = Math.round((done / 20) * 100);
  const fill = document.getElementById('progressFill');
  const txt  = document.getElementById('progressText');
  if (fill) fill.style.width = pct + '%';
  if (txt)  txt.textContent  = `${done} / 20 (${pct}%)`;
}

function renderSidebar() {
  const sb = document.getElementById('sidebar');
  let html = '';
  for (let w = 1; w <= 4; w++) {
    const wSessions = sessions.filter(s => s.week === w);
    const doneInWeek = wSessions.filter(s => state.progress[s.id]?.completed).length;
    html += `<div class="week-group w${w}">
      <div class="week-label">${weekNames[w]} <span class="week-badge">${doneInWeek}/${wSessions.length}</span></div>`;
    wSessions.forEach(s => {
      const isDone   = !!state.progress[s.id]?.completed;
      const isActive = state.currentSession === s.id;
      const shortTitle = s.title.length > 38 ? s.title.substring(0,38)+'…' : s.title;
      html += `<button class="session-btn${isDone?' done':''}${isActive?' active':''}" onclick="goSession(${s.id})">
        <span class="s-num">${isDone ? '✓' : s.id}</span>
        <span class="s-name">${shortTitle}</span>
        ${s.isFriday ? '<span class="friday-tag">🎬</span>' : ''}
      </button>`;
    });
    html += '</div>';
  }
  sb.innerHTML = html;
}

function renderSession(id) {
  const s      = sessions.find(x => x.id === id);
  if (!s) return;
  const log    = state.progress[id] || {};
  const isDone = !!log.completed;
  const color  = weekColors[s.week];
  const stepsHtml = s.pasos.map(p => `<li>${p}</li>`).join('');

  // Reset pomodoro to focus phase when switching sessions
  clearInterval(pomoInterval);
  pomoRunning   = false;
  pomoPhase     = 0;
  pomoRemaining = PHASES[0].minutes * 60;
  pomoCycle     = 1;

  document.getElementById('session-view').innerHTML = `
    <!-- RESOURCES ACCORDION -->
    <div class="resources-accordion" id="resourcesAccordion">
      <button class="resources-toggle" onclick="toggleResources()">
        <span>📚 Recursos del plan</span>
        <span class="chevron">▼</span>
      </button>
      <div class="resources-body">
        <div class="resource-list" style="margin-top:14px">
          <div class="resource-item"><div class="resource-icon">🟠</div><div class="resource-info">
            <a href="https://www.blenderguru.com/" target="_blank">Blender Guru — Tutorial Donut 5.0 <span class="resource-badge">GRATIS</span></a>
            <p>El tutorial de referencia para principiantes. Cubre modelado, materiales, iluminación y render.</p>
          </div></div>
          <div class="resource-item"><div class="resource-icon">🔵</div><div class="resource-info">
            <a href="https://studio.blender.org/training/" target="_blank">Blender Studio Training <span class="resource-badge">GRATIS</span></a>
            <p>Cursos oficiales de la Fundación Blender: Animation Fundamentals, Fundamentals 4.5 LTS y más.</p>
          </div></div>
          <div class="resource-item"><div class="resource-icon">🌍</div><div class="resource-info">
            <a href="https://polyhaven.com/" target="_blank">Poly Haven — Texturas, HDRIs y modelos <span class="resource-badge">GRATIS</span></a>
            <p>Biblioteca de assets 3D 100% gratuita y sin licencias.</p>
          </div></div>
          <div class="resource-item"><div class="resource-icon">💬</div><div class="resource-info">
            <a href="https://discord.me/blender-en-espanol" target="_blank">Blender en Español — Discord <span class="resource-badge">GRATIS</span></a>
            <p>Comunidad hispanohablante de Blender para preguntas y feedback.</p>
          </div></div>
          <div class="resource-item"><div class="resource-icon">🎨</div><div class="resource-info">
            <a href="https://www.facebook.com/campus.uy" target="_blank">Animation Campus — Animación 3D (pago)</a>
            <p>Academia privada · Bulevar Artigas 1082, Montevideo. Verificar agenda 2026.</p>
          </div></div>
          <div class="resource-item"><div class="resource-icon">📖</div><div class="resource-info">
            <a href="https://docs.blender.org/manual/en/latest/" target="_blank">Documentación oficial de Blender <span class="resource-badge">GRATIS</span></a>
            <p>Manual completo para resolver dudas técnicas específicas.</p>
          </div></div>
        </div>
      </div>
    </div>

    <!-- SESSION CARD -->
    <div class="today-card">
      <div class="today-meta">
        <span class="tag" style="background:${color}22;color:${color}">Semana ${s.week}</span>
        <span class="tag tag-day">${dayNames[s.day]}</span>
        <span class="tag tag-duration">⏱ ${s.duracion}</span>
        ${s.isFriday ? '<span class="tag tag-friday">🎬 Integración</span>' : ''}
        ${isDone ? '<span class="tag tag-done">✓ Completada</span>' : ''}
      </div>
      <div class="today-title">Sesión ${s.id}: ${s.title}</div>
      <div class="today-objective">🎯 ${s.objetivo}</div>

      <!-- POMODORO -->
      <div class="pomodoro-wrap">
        <div class="pomo-tabs">
          <button id="pomo-tab-0" class="pomo-tab active" onclick="switchPhase(0)">Focus</button>
          <button id="pomo-tab-1" class="pomo-tab short" onclick="switchPhase(1)">Short Break</button>
          <button id="pomo-tab-2" class="pomo-tab long"  onclick="switchPhase(2)">Long Break</button>
        </div>
        <div class="pomodoro">
          <div class="pomo-left">
            <div class="pomo-phase-label" id="pomo-phase-label">Focus</div>
            <div id="pomo-time" class="pomo-time">25:00</div>
            <div id="pomo-cycle" class="pomo-cycle">Pomodoro 1 de 4</div>
            <div style="font-size:0.72rem;color:var(--muted);margin-top:2px">🍅 ${log.pomodoros || 0} completados en esta sesión</div>
          </div>
          <div class="pomo-btns">
            <button class="btn btn-primary" onclick="startPomo()">▶ Start</button>
            <button class="btn btn-secondary" onclick="pausePomo()">⏸ Pause</button>
            <button class="btn btn-secondary" onclick="resetPomo()">↺ Reset</button>
          </div>
        </div>
      </div>

      <!-- DETAILS -->
      <div class="details-grid">
        <div class="detail-box">
          <h3>📋 Tarea principal</h3>
          <p>${s.tarea}</p>
        </div>
        <div class="detail-box">
          <h3>🔗 Recurso de esta sesión</h3>
          <p><a href="${s.recurso.url}" target="_blank" class="detail-resource">${s.recurso.nombre}</a></p>
        </div>
        <div class="detail-box" style="grid-column:1/-1">
          <h3>🪜 Pasos concretos</h3>
          <ul>${stepsHtml}</ul>
        </div>
        <div class="detail-box">
          <h3>✅ Resultado esperado</h3>
          <p>${s.resultado}</p>
        </div>
        <div class="detail-box">
          <h3>🧪 Comprobación</h3>
          <p class="check-pill">${s.comprobacion}</p>
        </div>
        <div class="detail-box" style="grid-column:1/-1">
          <h3>🔀 Alternativa si me bloqueo</h3>
          <p class="alt-pill">${s.alternativa}</p>
        </div>
      </div>

      <!-- LOG -->
      <div class="log-section">
        <h2>📝 Registro de esta sesión</h2>
        <div class="log-field">
          <label>¿Qué hiciste hoy?</label>
          <textarea id="log-done" placeholder="Describí qué completaste en esta sesión..."
            oninput="onLogInput()">${log.notes_done || ''}</textarea>
        </div>
        <div class="log-field">
          <label>Bloqueos y dudas</label>
          <textarea id="log-block" placeholder="¿En qué te trabaste? ¿Qué quedó pendiente?"
            oninput="onLogInput()">${log.notes_block || ''}</textarea>
        </div>
        <div class="log-field">
          <label>Próxima acción</label>
          <textarea id="log-next" placeholder="¿Qué vas a hacer en la próxima sesión?" style="min-height:50px"
            oninput="onLogInput()">${log.notes_next || ''}</textarea>
        </div>
        <div class="log-actions">
          <button class="btn btn-secondary" onclick="saveNow()">💾 Guardar</button>
          ${!isDone
            ? `<button class="btn btn-success" onclick="markDone(${s.id})">✅ Marcar completada</button>`
            : `<button class="btn btn-muted" disabled>✓ Ya completada</button>`}
          ${id < 20 ? `<button class="btn btn-secondary" onclick="goSession(${id+1})">→ Siguiente</button>` : ''}
          <span class="saving-indicator" id="saving-indicator"></span>
        </div>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="history-section">
      <h2>📅 Historial de sesiones</h2>
      ${renderHistory()}
    </div>
  `;

  updatePomoUI();
}

function renderHistory() {
  const entries = sessions
    .map(s => ({ s, log: state.progress[s.id] }))
    .filter(({ log }) => log && (log.notes_done || log.notes_block || log.completed));
  if (entries.length === 0) {
    return '<div class="history-empty">Todavía no hay sesiones registradas. ¡Empezá tu primera sesión!</div>';
  }
  return entries.reverse().map(({ s, log }) => {
    const date = log.updated_at ? new Date(log.updated_at).toLocaleDateString('es-UY') : '—';
    return `<div class="history-item ${log.completed ? 'done' : ''}">
      <div class="history-meta">
        <span class="history-date">📅 ${date}</span>
        <span class="history-snum">Sesión ${s.id}</span>
        <span class="history-status ${log.completed ? 'done' : 'partial'}">${log.completed ? '✓ Completada' : '⏳ En progreso'}</span>
        ${log.pomodoros ? `<span style="font-size:0.68rem;color:var(--accent3)">🍅 ${log.pomodoros}</span>` : ''}
      </div>
      <div class="history-title">${s.title}</div>
      <div class="history-body">
        ${log.notes_done  ? `<p><strong>Hice:</strong> ${log.notes_done}</p>` : ''}
        ${log.notes_block ? `<p><strong>Bloqueo:</strong> ${log.notes_block}</p>` : ''}
        ${log.notes_next  ? `<p><strong>Próximo:</strong> ${log.notes_next}</p>` : ''}
      </div>
    </div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════════
// ACTIONS
// ══════════════════════════════════════════════════════════════
function onLogInput() {
  const sid = state.currentSession;
  if (!state.progress[sid]) state.progress[sid] = {};
  state.progress[sid].notes_done  = document.getElementById('log-done')?.value  || '';
  state.progress[sid].notes_block = document.getElementById('log-block')?.value || '';
  state.progress[sid].notes_next  = document.getElementById('log-next')?.value  || '';
  setSavingIndicator('saving');
  scheduleSave(sid);
}

function saveNow() {
  const sid = state.currentSession;
  if (!state.progress[sid]) state.progress[sid] = {};
  state.progress[sid].notes_done  = document.getElementById('log-done')?.value  || '';
  state.progress[sid].notes_block = document.getElementById('log-block')?.value || '';
  state.progress[sid].notes_next  = document.getElementById('log-next')?.value  || '';
  saveSession(sid).then(() => showToast('Nota guardada ✓'));
}

function markDone(id) {
  saveNow();
  if (!state.progress[id]) state.progress[id] = {};
  state.progress[id].completed = true;
  state.progress[id].notes_done  = document.getElementById('log-done')?.value  || '';
  state.progress[id].notes_block = document.getElementById('log-block')?.value || '';
  state.progress[id].notes_next  = document.getElementById('log-next')?.value  || '';
  saveSession(id).then(() => {
    updateProgress();
    renderSidebar();
    renderSession(id);
    showToast('¡Sesión completada! 🎉');
  });
}

function goSession(id) {
  state.currentSession = id;
  renderSidebar();
  renderSession(id);
  document.querySelector('.main').scrollTop = 0;
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.classList.remove('show'), 3200);
}

function exportMarkdown() {
  const lines = ['# Plan Animación 3D — Uruguay', '', '## Historial de sesiones', ''];
  sessions.forEach(s => {
    const log = state.progress[s.id];
    if (!log && !log?.completed) return;
    lines.push(`### Sesión ${s.id}: ${s.title}`);
    lines.push(`- **Estado:** ${log.completed ? 'Completada ✓' : 'En progreso'}`);
    if (log.updated_at) lines.push(`- **Fecha:** ${new Date(log.updated_at).toLocaleDateString('es-UY')}`);
    if (log.pomodoros)  lines.push(`- **Pomodoros:** ${log.pomodoros} 🍅`);
    if (log.notes_done)  lines.push(`- **Hice:** ${log.notes_done}`);
    if (log.notes_block) lines.push(`- **Bloqueo:** ${log.notes_block}`);
    if (log.notes_next)  lines.push(`- **Próximo:** ${log.notes_next}`);
    lines.push('');
  });
  lines.push('---');
  lines.push(`*Exportado el ${new Date().toLocaleDateString('es-UY')} — Plan Animación 3D Uruguay*`);
  const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'historial-animacion3d.md';
  a.click();
  showToast('Historial exportado ✓');
}

// ══════════════════════════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════════════════════════
document.getElementById('logoutBtn').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = 'index.html';
});

function toggleResources() {
  document.getElementById('resourcesAccordion').classList.toggle('open');
}

async function showApp(email) {
  document.getElementById('userEmail').textContent = email;
  document.getElementById('app').classList.add('visible');
  document.getElementById('loadingScreen').classList.remove('hidden');
  document.getElementById('loadingScreen').querySelector('p').textContent = 'Cargando tu progreso...';
  await loadProgress();
  document.getElementById('loadingScreen').classList.add('hidden');
  updateProgress();
  renderSidebar();
  renderSession(state.currentSession);
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
(async () => {
  try {
    const res  = await fetch('/api/auth/me');
    const data = await res.json();
    if (res.ok && data.email) {
      await showApp(data.email);
    } else {
      // No autenticado → volver al login del Pomodoro
      window.location.href = 'index.html';
    }
  } catch (e) {
    window.location.href = 'index.html';
  }
})();
